version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: supplysense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-supplysense}
      POSTGRES_USER: ${DB_USER:-supplysense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supplysense_dev_pw}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - supplysense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-supplysense}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    container_name: supplysense_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-supplysense}
      DB_USER: ${DB_USER:-supplysense}
      DB_PASSWORD: ${DB_PASSWORD:-supplysense_dev_pw}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    command: ["python", "-m", "scripts.run_phase1_pipeline"]

  # app:
  #   build: .
  #   container_name: supplysense_app
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_NAME: ${DB_NAME:-supplysense}
