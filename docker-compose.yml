  #     - "8501:8501"
  #   command: ["streamlit", "run", "app/ui/Home.py", "--server.port=8501", "--server.address=0.0.0.0"]
  #   # Enabled in Phase 4 once the Streamlit app exists.

volumes:
  supplysense_pgdata:
